<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>跳一跳 Jump Jump</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #1b1f3b; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #game { display: block; width: 100%; height: 100%; touch-action: none; cursor: pointer; }

  /* HUD */
  #hud { position: fixed; top: 18px; left: 0; right: 0; display: flex; justify-content: space-between; padding: 0 22px; pointer-events: none; z-index: 5; }
  #score { font-size: 52px; font-weight: 800; color: #fff; text-shadow: 0 3px 10px rgba(0,0,0,.35); line-height: 1; }
  #score small { display: block; font-size: 14px; font-weight: 500; opacity: .8; margin-top: 4px; letter-spacing: 2px; }
  #best { font-size: 16px; font-weight: 600; color: #fff; text-align: right; opacity: .9; text-shadow: 0 2px 6px rgba(0,0,0,.3); }
  #best b { display: block; font-size: 26px; margin-top: 2px; }

  /* 蓄力条 */
  #powerWrap { position: fixed; left: 50%; transform: translateX(-50%); bottom: 90px; width: 220px; height: 12px; background: rgba(255,255,255,.25); border-radius: 10px; overflow: hidden; opacity: 0; transition: opacity .15s; z-index: 5; }
  #powerWrap.show { opacity: 1; }
  #power { height: 100%; width: 0%; background: linear-gradient(90deg,#ffd86b,#ff7eb3); border-radius: 10px; }

  /* 弹层 */
  .overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; color: #fff; text-align: center; padding: 24px;
             background: radial-gradient(circle at 50% 30%, rgba(60,70,130,.55), rgba(20,24,55,.9)); backdrop-filter: blur(3px); }
  .overlay.hide { display: none; }
  .overlay h1 { font-size: 46px; font-weight: 800; margin-bottom: 6px; letter-spacing: 4px; text-shadow: 0 4px 14px rgba(0,0,0,.4); }
  .overlay h2 { font-size: 30px; font-weight: 700; margin-bottom: 14px; }
  .overlay p { font-size: 16px; opacity: .85; line-height: 1.9; max-width: 360px; }
  .overlay .big { font-size: 64px; font-weight: 800; color: #ffd86b; margin: 10px 0; }
  .overlay .tip { margin-top: 22px; font-size: 15px; opacity: .75; }
  .btn { margin-top: 26px; padding: 14px 40px; font-size: 18px; font-weight: 700; color: #1b1f3b; background: linear-gradient(135deg,#ffd86b,#ff9a8b); border: none; border-radius: 40px; cursor: pointer;
          box-shadow: 0 8px 24px rgba(255,154,139,.45); transition: transform .12s; }
  .btn:active { transform: scale(.95); }
  .key { display: inline-block; padding: 2px 10px; border: 1px solid rgba(255,255,255,.5); border-radius: 6px; font-size: 13px; margin: 0 2px; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="score">0<small>SCORE</small></div>
  <div id="best">最高分<b id="bestVal">0</b></div>
</div>

<div id="powerWrap"><div id="power"></div></div>

<!-- 开始界面 -->
<div class="overlay" id="startScreen">
  <h1>跳 一 跳</h1>
  <p>按住 <span class="key">鼠标</span> / <span class="key">空格</span> 蓄力，松手起跳。<br>跳得越久，跳得越远。落在方块正中可触发连击加分！</p>
  <button class="btn" id="startBtn">开始游戏</button>
  <div class="tip">提示：踩在中心点会获得额外分数与连击奖励</div>
</div>

<!-- 结束界面 -->
<div class="overlay hide" id="overScreen">
  <h2>游戏结束</h2>
  <div class="big" id="finalScore">0</div>
  <p id="overMsg">再来一局，挑战更高分！</p>
  <button class="btn" id="retryBtn">再跳一次</button>
  <div class="tip">本局最高连击：<span id="maxCombo">0</span></div>
</div>

<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  // 视图与高分
  let W = 0, H = 0, DPR = 1;
  const bestEl = document.getElementById("bestVal");
  let best = +(localStorage.getItem("jump_best") || 0);
  bestEl.textContent = best;

  // 常量
  const GROUND_RATIO = 0.72;        // 平台顶部所在屏幕高度比例
  const FIXED_X = () => W * 0.28;   // 角色固定屏幕 x
  const PLAYER_R = 18;              // 角色半径
  const MAX_POWER = 360;            // 最大蓄力（=最大跳跃距离）
  const CHARGE_RATE = 300;          // 蓄力速度（/秒）
  const SPEED = 760;                // 跳跃水平速度（/秒）
  const MIN_GAP = 120, MAX_GAP = 300;
  const MIN_W = 60, MAX_W = 120;

  const PLATFORM_COLORS = [
    ["#ff9a8b","#ff6a88"], ["#a18cd1","#6a5acd"], ["#84fab0","#4ca1af"],
    ["#fbc2eb","#a18cd1"], ["#f6d365","#fda085"], ["#5ee7df","#3a8fd8"],
    ["#ffecd2","#fcb69f"], ["#c2e9fb","#81a4fd"]
  ];

  // 状态
  let state = "ready";  // ready | charging | jumping | over
  let platforms = [];
  let currentIndex = 0;
  let camX = 0;
  let score = 0, combo = 0, maxCombo = 0;
  let power = 0, charging = false;
  let player = { x: 0, y: 0, vy: 0, squash: 0 }; // y 为站立面（平台顶）
  let jump = null; // {sx, sy, ex, ey, t, dur, arc}
  let fall = null; // {vx, vy}

  // 工具
  const rand = (a, b) => a + Math.random() * (b - a);
  const lerp = (a, b, t) => a + (b - a) * t;

  function groundY() { return H * GROUND_RATIO; }

  function makePlatform(x, w) {
    const c = PLATFORM_COLORS[(Math.random() * PLATFORM_COLORS.length) | 0];
    return { x, w, top: groundY(), h: rand(60, 130), c0: c[0], c1: c[1], lit: false };
  }

  function reset() {
    score = 0; combo = 0; maxCombo = 0; power = 0; charging = false;
    jump = null; fall = null;
    const startW = 110;
    platforms = [ makePlatform(0, startW) ];
    currentIndex = 0;
    for (let i = 0; i < 6; i++) spawnPlatform();
    const first = platforms[0];
    player.x = first.x + first.w / 2;
    player.y = first.top;
    player.squash = 0;
    camX = player.x - FIXED_X();
    updateHud();
  }

  function spawnPlatform() {
    const last = platforms[platforms.length - 1];
    const gap = rand(MIN_GAP, MAX_GAP);
    const w = rand(MIN_W, MAX_W);
    platforms.push(makePlatform(last.x + last.w / 2 + gap - w / 2, w));
  }

  function targetPlatform() {
    // 当前要跳向的“下一个”平台（玩家所站平台的相邻右平台）
    return platforms[currentIndex + 1];
  }

  // 输入
  function pressStart() {
    if (state !== "idle") return;
    state = "charging";
    charging = true;
    power = 0;
    document.getElementById("powerWrap").classList.add("show");
  }
  function pressEnd() {
    if (state !== "charging") return;
    charging = false;
    document.getElementById("powerWrap").classList.remove("show");
    startJump();
  }

  function startJump() {
    const dist = power;
    const tp = targetPlatform();
    const ex = player.x + dist;        // 落点世界 x（角色中心）
    const ey = tp.top;                 // 高度近似（平台同高）
    const dur = 0.18 + dist / SPEED;
    const arc = Math.max(60, dist * 0.55);
    jump = { sx: player.x, sy: player.y, ex, ey, t: 0, dur, arc };
    state = "jumping";
    beep(520, 0.06, "sine");
  }

  function land() {
    const tp = platforms[currentIndex + 1];
    const center = tp.x + tp.w / 2;
    const dx = Math.abs(player.x - center);
    if (player.x < tp.x || player.x > tp.x + tp.w) {
      // 没踩中 → 掉落
      fall = { vx: (player.x - tp.x > 0 ? 1 : -1) * 40, vy: 0 };
      state = "over-setup";
      return;
    }
    // 踩中
    tp.lit = true;
    if (dx < 10) {
      combo++;
      maxCombo = Math.max(maxCombo, combo);
      score += 1 + combo;            // 完美 + 连击奖励
      showCombo(combo);
      player.squash = 1;             // 完美弹一下
      beep(740 + combo * 40, 0.08, "triangle");
    } else {
      combo = 0;
      score += 1;
      player.squash = 0.5;
      beep(600, 0.05, "sine");
    }
    currentIndex++;
    spawnPlatform();
    updateHud();
    state = "idle";
  }

  let comboTimer = 0;
  function showCombo(c) {
    if (c >= 2) {
      comboTimer = 0.9;
    }
  }

  function gameOver() {
    state = "over";
    if (score > best) { best = score; localStorage.setItem("jump_best", best); bestEl.textContent = best; }
    document.getElementById("finalScore").textContent = score;
    document.getElementById("maxCombo").textContent = maxCombo;
    document.getElementById("overMsg").textContent = score >= best && score > 0
      ? "新纪录！太强了 🎉" : "再来一局，挑战更高分！";
    document.getElementById("overScreen").classList.remove("hide");
  }

  // 主循环
  let lastT = performance.now();
  function loop(now) {
    let dt = (now - lastT) / 1000;
    lastT = now;
    if (dt > 0.05) dt = 0.05;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  function update(dt) {
    if (state === "charging") {
      power = Math.min(MAX_POWER, power + CHARGE_RATE * dt);
      document.getElementById("power").style.width = (power / MAX_POWER * 100) + "%";
      player.squash = 0.2 + (power / MAX_POWER) * 0.5; // 蓄力下蹲
    } else if (state === "jumping") {
      jump.t += dt / jump.dur;
      if (jump.t >= 1) { jump.t = 1; player.x = jump.ex; player.y = jump.ey; land(); }
      else {
        const t = jump.t;
        player.x = lerp(jump.sx, jump.ex, t);
        player.y = lerp(jump.sy, jump.ey, t) - jump.arc * Math.sin(Math.PI * t);
      }
    } else if (state === "over-setup") {
      // 角色掉出平台
      fall.vy += 1800 * dt;
      player.x += fall.vx * dt;
      player.y += fall.vy * dt;
      camX = player.x - FIXED_X();
      if (player.y > H + 100) gameOver();
    } else if (state === "idle") {
      // 等待下一次蓄力，平滑相机
      player.squash = Math.max(0, player.squash - dt * 4);
    }

    if (state !== "over" && state !== "over-setup" && state !== "ready") {
      // 相机跟随（玩家固定在 FIXED_X）
      const targetCam = player.x - FIXED_X();
      camX = lerp(camX, targetCam, Math.min(1, dt * 8));
    }
    if (comboTimer > 0) comboTimer -= dt;
  }

  // 渲染
  function render() {
    // 背景渐变
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, "#20254d");
    g.addColorStop(0.55, "#2b3168");
    g.addColorStop(1, "#3a4085");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // 远景装饰（云/星点）
    drawBackdrop();

    ctx.save();
    ctx.translate(-camX, 0);

    // 平台
    for (const p of platforms) drawPlatform(p);

    // 角色阴影落在当前/目标平台
    drawPlayer();

    ctx.restore();

    // 连击提示
    if (comboTimer > 0 && combo >= 2) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, comboTimer);
      ctx.fillStyle = "#ffd86b";
      ctx.font = "800 " + Math.round(W * 0.06) + "px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("完美 x" + combo + "  +" + (1 + combo), W / 2, H * 0.32);
      ctx.restore();
    }
  }

  let stars = null;
  function drawBackdrop() {
    if (!stars) {
      stars = [];
      for (let i = 0; i < 40; i++) stars.push({ x: Math.random(), y: Math.random() * 0.5, r: Math.random() * 1.6 + 0.4, a: Math.random() * 0.5 + 0.2 });
    }
    ctx.save();
    for (const s of stars) {
      ctx.globalAlpha = s.a;
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawPlatform(p) {
    const x = p.x, y = p.top, w = p.w, h = p.h;
    // 柱体（带侧面阴影）
    const grad = ctx.createLinearGradient(x, y, x, y + h);
    grad.addColorStop(0, p.c0);
    grad.addColorStop(1, p.c1);
    ctx.fillStyle = grad;
    roundRect(x, y, w, h, 8);
    ctx.fill();
    // 顶面高光
    ctx.fillStyle = "rgba(255,255,255,.35)";
    roundRect(x, y, w, 10, 6);
    ctx.fill();
    // 中心标记
    ctx.strokeStyle = "rgba(255,255,255,.55)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x + w / 2, y);
    ctx.lineTo(x + w / 2, y + 14);
    ctx.stroke();
    if (p.lit) {
      ctx.fillStyle = "rgba(255,216,107,.9)";
      ctx.beginPath();
      ctx.arc(x + w / 2, y, 5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawPlayer() {
    const x = player.x;
    const baseY = player.y; // 站立面
    const r = PLAYER_R;
    const sq = player.squash; // 0~1 下蹲/弹起程度
    const bodyH = r * 2 * (1 + sq * 0.35);
    const bodyW = r * 2 * (1 - sq * 0.25);

    // 阴影
    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,.22)";
    ctx.beginPath();
    ctx.ellipse(x, baseY + 2, bodyW * 0.7, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 身体
    const top = baseY - bodyH;
    const bg = ctx.createLinearGradient(x - bodyW/2, top, x + bodyW/2, baseY);
    bg.addColorStop(0, "#ffffff");
    bg.addColorStop(1, "#d7e3ff");
    ctx.fillStyle = bg;
    roundRect(x - bodyW/2, top, bodyW, bodyH, bodyW/2);
    ctx.fill();

    // 眼睛
    const eyeY = top + bodyH * 0.4;
    const ex = bodyW * 0.22;
    ctx.fillStyle = "#2b2f55";
    ctx.beginPath(); ctx.arc(x - ex, eyeY, r * 0.16, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + ex, eyeY, r * 0.16, 0, Math.PI * 2); ctx.fill();
    // 腮红
    ctx.fillStyle = "rgba(255,140,160,.6)";
    ctx.beginPath(); ctx.arc(x - ex - 4, eyeY + 6, r * 0.12, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(x + ex + 4, eyeY + 6, r * 0.12, 0, Math.PI * 2); ctx.fill();
  }

  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function updateHud() {
    document.getElementById("score").firstChild.textContent = score;
  }

  // 简易音效
  let actx = null;
  function beep(freq, dur, type) {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type || "sine"; o.frequency.value = freq;
      g.gain.setValueAtTime(0.12, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + dur);
    } catch (e) {}
  }

  // 尺寸
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // 平台高度随屏幕更新
    const gy = groundY();
    for (const p of platforms) p.top = gy;
  }
  window.addEventListener("resize", resize);

  // 事件
  canvas.addEventListener("mousedown", pressStart);
  window.addEventListener("mouseup", pressEnd);
  canvas.addEventListener("touchstart", (e) => { e.preventDefault(); pressStart(); }, { passive: false });
  window.addEventListener("touchend", (e) => { e.preventDefault(); pressEnd(); }, { passive: false });
  window.addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); if (state === "ready" || state === "over") return; pressStart(); } });
  window.addEventListener("keyup", (e) => { if (e.code === "Space") { e.preventDefault(); pressEnd(); } });

  document.getElementById("startBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    document.getElementById("startScreen").classList.add("hide");
    state = "idle"; reset();
  });
  document.getElementById("retryBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    document.getElementById("overScreen").classList.add("hide");
    state = "idle"; reset();
  });

  // 启动
  resize();
  reset();
  state = "ready"; // 等开始按钮
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
